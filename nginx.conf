server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: qualquer rota desconhecida cai no index.html (React Router cuida do resto)
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|svg|png|jpg|jpeg|webp|woff2?|ttf|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # o service worker do PWA não pode ser cacheado, senão updates não chegam
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
